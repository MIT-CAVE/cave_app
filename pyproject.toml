[tool.black]
line-length = 100
target-version = ['py311']
exclude = '/.*(migrations|__pycache__).*/'

[tool.setuptools]
packages = [
    "cave_api"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cave_app"
version = "3.6.0"
description = "A CAVE Application"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "autoflake==2.3.1",
    "black==25.12.0",
    "cave_utils==3.5.7",
    "Django>=6.0.6,<7.0.0",
    "django-import-export==4.3.14",
    "djangorestframework==3.16.1",
    "django_otp==1.6.3",
    "django_sockets==2.0.1",
    "daphne==4.2.1",
    "django-solo==2.4.0",
    "pamda>=2.10.0,<3.0.0",
    "pillow==12.0.0",
    "psycopg[binary, pool]==3.3.2",
    "python-decouple==3.8",
    "qrcode==8.2",
    "redis==7.1.0",
    "type_enforced>=2.6.0,<3.0.0",
    "whitenoise==6.11.0",
]

[project.optional-dependencies]
cave_api = [
    "requests>=2.32.2,<3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/mit-cave/cave_app"
"Bug Tracker" = "https://github.com/mit-cave/cave_app/issues"
